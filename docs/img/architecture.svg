<text class="t" x="24" y="682" font-size="12" text-anchor="start" font-weight="600">Main loop (rslk_esp32_pid_avoid.ino), no RTOS tasks of its own:</text>
<text class="s" x="24" y="702" font-size="12" text-anchor="start">consoleStep() → webStep() → sonarUpdate() every 60 ms → imuUpdate() every 10 ms → behaviorStep() → controlUpdate() every 10 ms (100 Hz)</text>

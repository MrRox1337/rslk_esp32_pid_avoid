<text class="s" x="300.0" y="111.5" font-size="10.5" text-anchor="middle">phone or PC: control page</text>
<rect class="ui" x="540" y="70" width="130" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="605.0" y="96.5" font-size="12" text-anchor="middle" font-weight="600">Serial monitor</text>

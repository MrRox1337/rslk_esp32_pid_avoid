<text class="s" x="490.0" y="306.5" font-size="10.5" text-anchor="middle">modes IDLE / AUTO / MANUAL  ·  overtake state machine CRUISE → PASS_OUT → PASS_BACK</text>
<text class="s" x="490.0" y="321.5" font-size="10.5" text-anchor="middle">odometry (x, lane offset y, heading ψ)  ·  steering  ·  manual heading hold  ·  flight recorder</text>

<rect class="bg" width="1010" height="760" rx="8"/>
<text class="t" x="24" y="30" font-size="15" font-weight="600">System architecture</text>
<text class="s" x="24" y="49" font-size="12">Firmware modules on the ESP32, grouped in layers. Arrows show which module calls or feeds which</text>
<rect class="lay" x="24" y="62" width="846" height="76" rx="6"/>

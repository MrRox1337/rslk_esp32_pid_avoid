<text class="t" x="300.0" y="174.0" font-size="12" text-anchor="middle" font-weight="600">web.*  +  web_page.h</text>
<text class="s" x="300.0" y="189.0" font-size="10.5" text-anchor="middle">WiFi (hotspot or own AP), mDNS rslk.local</text>
<text class="s" x="300.0" y="204.0" font-size="10.5" text-anchor="middle">/  /drive  /speed  /status  /cmd  /rec</text>

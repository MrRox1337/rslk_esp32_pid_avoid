<rect class="bg" width="920" height="640" rx="8"/>
<text class="t" x="24" y="30" font-size="15" font-weight="600">Wiring diagram</text>
<text class="s" x="24" y="49" font-size="12">Signal pins as defined in config.h. Power: 6×AA → RSLK board → 5 V regulator → ESP32; the ESP32 3.3 V rail feeds the encoders and the BNO055</text>
<rect class="mcu" x="440" y="90" width="160" height="500" rx="6" stroke-width="1.2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 660" width="970" height="660" role="img" aria-label="Data flow from sonar, gyro and encoders through odometry, steering, ramps and PIDs to the motors">
<style>
.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.s{fill:#52514e}.m{fill:#898781}
.box{fill:#f3f2ee;stroke:#898781}.hw{fill:#fbe9e1;stroke:#eb6834}.ui{fill:#e8f0fb;stroke:#2a78d6}
.lay{fill:none;stroke:#c3c2b7;stroke-dasharray:4 4}
.ar{stroke:#52514e}.ah{fill:#52514e}.ph{stroke:#eb6834}.phh{fill:#eb6834}.rc{stroke:#898781}.rch{fill:#898781}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19}.t{fill:#f0efec}.s{fill:#c3c2b7}.box{fill:#262624;stroke:#6b6a65}
.hw{fill:#35211a;stroke:#d95926}.ui{fill:#1d2a3b;stroke:#3987e5}.lay{stroke:#383835}
.ar{stroke:#c3c2b7}.ah{fill:#c3c2b7}.ph{stroke:#d95926}.phh{fill:#d95926}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
<rect class="bg" width="970" height="660" rx="8"/>
<text class="t" x="24" y="30" font-size="15" font-weight="600">Data flow: from sensors to motors</text>
<text class="s" x="24" y="49" font-size="12">One pass of the control loop. The bottom row closes the loop: wheel motion is measured by the encoders</text>
<rect class="hw" x="24" y="80" width="160" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="104.0" y="106.5" font-size="12" text-anchor="middle" font-weight="600">HC-SR04 sonar</text>
<text class="s" x="104.0" y="121.5" font-size="10.5" text-anchor="middle">echo time</text>
<rect class="box" x="254" y="80" width="170" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="339.0" y="106.5" font-size="12" text-anchor="middle" font-weight="600">Sonar filter</text>
<text class="s" x="339.0" y="121.5" font-size="10.5" text-anchor="middle">median of 3, every 60 ms</text>
<rect class="box" x="494" y="80" width="180" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="584.0" y="99.0" font-size="12" text-anchor="middle" font-weight="600">Overtake state machine</text>
<text class="s" x="584.0" y="114.0" font-size="10.5" text-anchor="middle">CRUISE → PASS_OUT → BACK</text>
<text class="s" x="584.0" y="129.0" font-size="10.5" text-anchor="middle">lane reference y_ref, ẏ_ref</text>
<rect class="hw" x="24" y="190" width="160" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="104.0" y="216.5" font-size="12" text-anchor="middle" font-weight="600">BNO055 gyro</text>
<text class="s" x="104.0" y="231.5" font-size="10.5" text-anchor="middle">fused heading, 100 Hz</text>
<rect class="box" x="254" y="190" width="170" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="339.0" y="216.5" font-size="12" text-anchor="middle" font-weight="600">Heading filter</text>
<text class="s" x="339.0" y="231.5" font-size="10.5" text-anchor="middle">unwrap, reject jumps > 20°</text>
<rect class="box" x="494" y="190" width="180" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="584.0" y="209.0" font-size="12" text-anchor="middle" font-weight="600">Odometry</text>
<text class="s" x="584.0" y="224.0" font-size="10.5" text-anchor="middle">x, lane offset y, heading ψ</text>
<text class="s" x="584.0" y="239.0" font-size="10.5" text-anchor="middle">(encoder ψ if no IMU)</text>
<rect class="box" x="774" y="80" width="170" height="170" rx="6" stroke-width="1.2"/>
<text class="t" x="859.0" y="139.0" font-size="12" text-anchor="middle" font-weight="600">Steering</text>
<text class="s" x="859.0" y="154.0" font-size="10.5" text-anchor="middle">ψ_ref = atan2(ẏ_ref, v)</text>
<text class="s" x="859.0" y="169.0" font-size="10.5" text-anchor="middle">  + atan2(y_ref − y, 20 cm)</text>
<text class="s" x="859.0" y="184.0" font-size="10.5" text-anchor="middle">turn = v · k · (ψ_ref − ψ)</text>
<text class="s" x="859.0" y="199.0" font-size="10.5" text-anchor="middle">limited to 0.6 · v</text>
<rect class="ui" x="24" y="295" width="160" height="55" rx="6" stroke-width="1.2"/>
<text class="t" x="104.0" y="319.0" font-size="12" text-anchor="middle" font-weight="600">Web page / console</text>
<text class="s" x="104.0" y="334.0" font-size="10.5" text-anchor="middle">user commands</text>
<rect class="box" x="774" y="295" width="170" height="55" rx="6" stroke-width="1.2"/>
<text class="t" x="859.0" y="319.0" font-size="12" text-anchor="middle" font-weight="600">Mode select</text>
<text class="s" x="859.0" y="334.0" font-size="10.5" text-anchor="middle">AUTO · MANUAL · IDLE</text>
<rect class="box" x="774" y="405" width="170" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="859.0" y="424.0" font-size="12" text-anchor="middle" font-weight="600">Setpoint ramps</text>
<text class="s" x="859.0" y="439.0" font-size="10.5" text-anchor="middle">3000 / 20000 ticks/s²</text>
<text class="s" x="859.0" y="454.0" font-size="10.5" text-anchor="middle">→ targets tgtL, tgtR</text>
<rect class="box" x="494" y="405" width="180" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="584.0" y="424.0" font-size="12" text-anchor="middle" font-weight="600">Wheel-sync PID</text>
<text class="s" x="584.0" y="439.0" font-size="10.5" text-anchor="middle">L − R travel vs ∫ commanded turn</text>
<text class="s" x="584.0" y="454.0" font-size="10.5" text-anchor="middle">→ correction ± corr</text>
<rect class="box" x="254" y="405" width="170" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="339.0" y="424.0" font-size="12" text-anchor="middle" font-weight="600">Wheel speed PIDs</text>
<text class="s" x="339.0" y="439.0" font-size="10.5" text-anchor="middle">feedforward + PID</text>
<text class="s" x="339.0" y="454.0" font-size="10.5" text-anchor="middle">per wheel, 100 Hz</text>
<rect class="hw" x="24" y="405" width="160" height="60" rx="6" stroke-width="1.2"/>
<text class="t" x="104.0" y="431.5" font-size="12" text-anchor="middle" font-weight="600">DRV8838 + motors</text>
<text class="s" x="104.0" y="446.5" font-size="10.5" text-anchor="middle">20 kHz PWM</text>
<rect class="hw" x="24" y="515" width="160" height="55" rx="6" stroke-width="1.2"/>
<text class="t" x="104.0" y="539.0" font-size="12" text-anchor="middle" font-weight="600">Wheel encoders</text>
<text class="s" x="104.0" y="554.0" font-size="10.5" text-anchor="middle">A/B quadrature</text>
<rect class="box" x="254" y="515" width="170" height="55" rx="6" stroke-width="1.2"/>
<text class="t" x="339.0" y="539.0" font-size="12" text-anchor="middle" font-weight="600">Speed estimate</text>
<text class="s" x="339.0" y="554.0" font-size="10.5" text-anchor="middle">Δticks / 10 ms, EMA α 0.3</text>
<rect class="box" x="494" y="515" width="180" height="55" rx="6" stroke-width="1.2"/>
<text class="t" x="584.0" y="539.0" font-size="12" text-anchor="middle" font-weight="600">PCNT counters</text>
<text class="s" x="584.0" y="554.0" font-size="10.5" text-anchor="middle">4× quadrature, in hardware</text>
<rect class="box" x="774" y="515" width="170" height="55" rx="6" stroke-width="1.2"/>
<text class="t" x="859.0" y="539.0" font-size="12" text-anchor="middle" font-weight="600">Flight recorder</text>
<text class="s" x="859.0" y="554.0" font-size="10.5" text-anchor="middle">20 Hz, 60 s → /rec CSV</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="184,110 254,110"/>
<polygon class="ah" points="254,110 246,105.5 246,114.5"/>
<polyline class="ar" fill="none" stroke-width="1.6" points="424,110 494,110"/>
<polygon class="ah" points="494,110 486,105.5 486,114.5"/>
<text class="m" x="459" y="102" font-size="10.5" text-anchor="middle">distance</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="674,110 774,110"/>
<polygon class="ah" points="774,110 766,105.5 766,114.5"/>
<text class="m" x="734" y="102" font-size="10.5" text-anchor="middle">y_ref, ẏ_ref</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="184,220 254,220"/>
<polygon class="ah" points="254,220 246,215.5 246,224.5"/>
<polyline class="ar" fill="none" stroke-width="1.6" points="424,220 494,220"/>
<polygon class="ah" points="494,220 486,215.5 486,224.5"/>
<text class="m" x="459" y="212" font-size="10.5" text-anchor="middle">ψ</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="674,220 774,220"/>
<polygon class="ah" points="774,220 766,215.5 766,224.5"/>
<text class="m" x="734" y="212" font-size="10.5" text-anchor="middle">y, ψ</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="584,190 584,140"/>
<polygon class="ah" points="584,140 579.5,148 588.5,148"/>
<text class="m" x="590" y="170" font-size="10.5" text-anchor="start">x (passed yet?)</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="859,250 859,295"/>
<polygon class="ah" points="859,295 854.5,287 863.5,287"/>
<text class="m" x="865" y="278" font-size="10.5" text-anchor="start">turn (AUTO)</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="184,322 774,322"/>
<polygon class="ah" points="774,322 766,317.5 766,326.5"/>
<text class="m" x="479" y="314" font-size="10.5" text-anchor="middle">go / stop, cruise speed, manual speed and turn</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="859,350 859,405"/>
<polygon class="ah" points="859,405 854.5,397 863.5,397"/>
<text class="m" x="865" y="383" font-size="10.5" text-anchor="start">drive(speed, turn)</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="774,435 674,435"/>
<polygon class="ah" points="674,435 682,430.5 682,439.5"/>
<text class="m" x="740" y="427" font-size="10.5" text-anchor="middle">tgtL, tgtR</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="494,435 424,435"/>
<polygon class="ah" points="424,435 432,430.5 432,439.5"/>
<text class="m" x="459" y="427" font-size="10.5" text-anchor="middle">tgt ∓ corr</text>
<polyline class="ph" fill="none" stroke-width="1.6" points="254,435 184,435"/>
<polygon class="phh" points="184,435 192,430.5 192,439.5"/>
<text class="m" x="219" y="427" font-size="10.5" text-anchor="middle">PWM</text>
<polyline class="rc" fill="none" stroke-width="1.6" stroke-dasharray="5 4" points="859,465 859,515"/>
<polygon class="rch" points="859,515 854.5,507 863.5,507"/>
<text class="m" x="865" y="492" font-size="10.5" text-anchor="start">every signal shown</text>
<polyline class="ph" fill="none" stroke-width="1.6" points="104,465 104,515"/>
<polygon class="phh" points="104,515 99.5,507 108.5,507"/>
<text class="m" x="110" y="492" font-size="10.5" text-anchor="start">wheels turn</text>
<polyline class="ph" fill="none" stroke-width="1.6" points="104,570 104,600 584,600 584,570"/>
<polygon class="phh" points="584,570 579.5,578 588.5,578"/>
<text class="m" x="344" y="594" font-size="10.5" text-anchor="middle">A/B pulses</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="494,542 424,542"/>
<polygon class="ah" points="424,542 432,537.5 432,546.5"/>
<text class="m" x="459" y="534" font-size="10.5" text-anchor="middle">posL, posR</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="339,515 339,465"/>
<polygon class="ah" points="339,465 334.5,473 343.5,473"/>
<text class="m" x="345" y="492" font-size="10.5" text-anchor="start">velL, velR</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="584,515 584,465"/>
<polygon class="ah" points="584,465 579.5,473 588.5,473"/>
<text class="m" x="590" y="492" font-size="10.5" text-anchor="start">posL − posR</text>
<polyline class="ar" fill="none" stroke-width="1.6" points="674,542 694,542 694,272 640,272 640,250"/>
<polygon class="ah" points="640,250 635.5,258 644.5,258"/>
<text class="m" x="700" y="500" font-size="10.5" text-anchor="start">wheel travel</text>
<line class="ar" x1="24" x2="48" y1="638" y2="638" stroke-width="2"/>
<text class="s" x="54" y="642" font-size="12" text-anchor="start">data in firmware</text>
<line class="ph" x1="190.8" x2="214.8" y1="638" y2="638" stroke-width="2"/>
<text class="s" x="220.8" y="642" font-size="12" text-anchor="start">physical / electrical</text>
<line class="rc" x1="391.6" x2="415.6" y1="638" y2="638" stroke-width="2" stroke-dasharray="5 4"/>
<text class="s" x="421.6" y="642" font-size="12" text-anchor="start">recorded</text>
</svg>